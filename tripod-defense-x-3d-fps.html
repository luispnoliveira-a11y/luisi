<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tripod Defense X - FPS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: monospace;
  }
  #canvas {
    display: block;
  }
  #hud {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #0f0;
    font-size: 14px;
    text-shadow: 0 0 10px #0f0;
    z-index: 10;
  }
  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 30px;
    height: 30px;
    border: 2px solid #0f0;
    pointer-events: none;
    z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: #0f0;
  }
  #crosshair::before {
    width: 10px;
    height: 2px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  #crosshair::after {
    width: 2px;
    height: 10px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  #menu {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    color: #0f0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    text-shadow: 0 0 20px #0f0;
    z-index: 100;
  }
  button {
    padding: 15px 30px;
    margin-top: 30px;
    background: #000;
    color: #0f0;
    border: 2px solid #0f0;
    cursor: pointer;
    font-size: 18px;
    font-family: monospace;
    text-shadow: 0 0 10px #0f0;
  }
  button:hover {
    background: #0f0;
    color: #000;
  }
  #instructions {
    font-size: 14px;
    margin-top: 20px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="hud">
  <div>PLAYER HP: <span id="playerHp">100</span>%</div>
  <div>BOT HP: <span id="botHp">100</span>%</div>
  <div style="margin-top: 20px;">JAM: <span id="jamText">READY</span></div>
</div>

<div id="crosshair"></div>

<div id="menu">
  <div>TRIPOD DEFENSE X</div>
  <div style="font-size: 16px; margin-top: 20px;">FIRST PERSON</div>
  <button onclick="startGame()">START GAME</button>
  <div id="instructions">
    WASD / Arrow Keys = Move<br>
    Mouse = Look Around<br>
    SPACE = JAM<br>
    Click to aim
  </div>
</div>

<script>
  // Three.js Scene Setup
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.Fog(0x000000, 500, 2000);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
  camera.position.set(0, 20, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Lighting
  const light = new THREE.DirectionalLight(0xffffff, 0.6);
  light.position.set(500, 500, 500);
  light.castShadow = true;
  light.shadow.mapSize.width = 2048;
  light.shadow.mapSize.height = 2048;
  scene.add(light);

  const ambientLight = new THREE.AmbientLight(0x00ff88, 0.4);
  scene.add(ambientLight);

  // Neon Grid Ground
  const gridHelper = new THREE.GridHelper(800, 40, 0x00ff88, 0x004422);
  gridHelper.position.y = 0;
  scene.add(gridHelper);

  // Player
  let player = {
    position: new THREE.Vector3(0, 20, 0),
    velocity: new THREE.Vector3(0, 0, 0),
    hp: 100,
    speed: 0.3,
    friction: 0.9
  };

  // Bot (Green sphere)
  const botGeometry = new THREE.SphereGeometry(8, 32, 32);
  const botMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00aa00 });
  const botMesh = new THREE.Mesh(botGeometry, botMaterial);
  botMesh.position.set(150, 20, 150);
  botMesh.castShadow = true;
  botMesh.receiveShadow = true;
  scene.add(botMesh);

  let bot = {
    position: botMesh.position,
    velocity: new THREE.Vector3(2, 0, 0),
    hp: 100,
    vx: 2
  };

  // Tripod (Yellow/Cyan rotating body with 3 legs)
  const tripodGroup = new THREE.Group();
  tripodGroup.position.set(0, 50, -300);

  const tripodBodyGeometry = new THREE.ConeGeometry(15, 40, 8);
  const tripodBodyMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffaa00 });
  const tripodBody = new THREE.Mesh(tripodBodyGeometry, tripodBodyMaterial);
  tripodBody.castShadow = true;
  tripodGroup.add(tripodBody);

  // Add 3 legs
  for (let i = 0; i < 3; i++) {
    const angle = (i * Math.PI * 2) / 3;
    const legGeometry = new THREE.CylinderGeometry(4, 4, 60, 16);
    const legMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffaa00 });
    const leg = new THREE.Mesh(legGeometry, legMaterial);
    leg.position.set(Math.cos(angle) * 20, -30, Math.sin(angle) * 20);
    leg.castShadow = true;
    tripodGroup.add(leg);
  }

  scene.add(tripodGroup);

  let tripod = {
    position: tripodGroup.position,
    direction: 1,
    speed: 0.2,
    jam: 0,
    jamDuration: 120,
    x: 0
  };

  // Laser beam
  let laserMesh = null;
  function createLaser(start, direction) {
    if (laserMesh) scene.remove(laserMesh);
    
    const laserGeometry = new THREE.BufferGeometry();
    const laserLength = 1500;
    const vertices = new Float32Array([
      start.x, start.y, start.z,
      start.x + direction.x * laserLength, start.y + direction.y * laserLength, start.z + direction.z * laserLength
    ]);
    laserGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    
    const laserMaterial = new THREE.LineBasicMaterial({ color: tripod.jam > 0 ? 0x00ffff : 0xffff00, linewidth: 3 });
    laserMesh = new THREE.Line(laserGeometry, laserMaterial);
    scene.add(laserMesh);
  }

  // Particles
  let particles = [];
  function createParticles(pos) {
    for (let i = 0; i < 50; i++) {
      particles.push({
        position: pos.clone(),
        velocity: new THREE.Vector3(
          (Math.random() - 0.5) * 5,
          (Math.random() - 0.5) * 5,
          (Math.random() - 0.5) * 5
        ),
        life: 60
      });
    }
  }

  // Game State
  let running = false;
  let keys = {};
  let jamCD = 0;
  let frame = 0;

  // Controls
  window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
    if (e.code === 'Space' && jamCD <= 0) {
      tripod.jam = tripod.jamDuration;
      jamCD = 600;
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  // Mouse Lock for FPS
  document.addEventListener('click', () => {
    if (running) renderer.domElement.requestPointerLock = renderer.domElement.requestPointerLock || renderer.domElement.mozRequestPointerLock;
    renderer.domElement.requestPointerLock();
  });

  let euler = new THREE.Euler(0, 0, 0, 'YXZ');
  let PI_2 = Math.PI / 2;

  document.addEventListener('mousemove', (event) => {
    if (document.pointerLockElement === renderer.domElement) {
      euler.setFromQuaternion(camera.quaternion);
      euler.rotateY(-event.movementX * 0.005);
      euler.rotateX(-event.movementY * 0.005);
      euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
      camera.quaternion.setFromEuler(euler);
    }
  });

  function startGame() {
    document.getElementById('menu').style.display = 'none';
    running = true;
    player.position.set(0, 20, 0);
    player.velocity.set(0, 0, 0);
    player.hp = 100;
    bot.position.set(150, 20, 150);
    bot.hp = 100;
    tripod.position.set(0, 50, -300);
    tripod.jam = 0;
    jamCD = 0;
    frame = 0;
    particles = [];
    camera.position.set(0, 20, 0);
    loop();
  }

  function loop() {
    if (!running) return;
    frame++;
    requestAnimationFrame(loop);

    // Movement
    const moveVector = new THREE.Vector3();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();

    camera.getWorldDirection(forward);
    forward.y = 0;
    forward.normalize();

    right.crossVectors(camera.up, forward).normalize();

    if (keys['w'] || keys['arrowup']) moveVector.add(forward);
    if (keys['s'] || keys['arrowdown']) moveVector.sub(forward);
    if (keys['d'] || keys['arrowright']) moveVector.add(right);
    if (keys['a'] || keys['arrowleft']) moveVector.sub(right);

    if (moveVector.length() > 0) {
      moveVector.normalize();
      player.velocity.add(moveVector.multiplyScalar(player.speed));
    }

    player.velocity.multiplyScalar(player.friction);
    player.position.add(player.velocity);
    player.position.y = 20;

    // Boundary
    if (player.position.length() > 400) {
      player.position.normalize().multiplyScalar(400);
    }

    camera.position.copy(player.position);

    // Update HUD
    document.getElementById('playerHp').innerText = Math.max(0, Math.ceil(player.hp));
    document.getElementById('botHp').innerText = Math.max(0, Math.ceil(bot.hp));
    if (jamCD > 0) {
      jamCD--;
      document.getElementById('jamText').innerText = 'RECHARGE ' + Math.ceil(jamCD / 60) + 's';
    } else {
      document.getElementById('jamText').innerText = 'READY';
    }

    // Bot movement
    bot.vx = Math.random() > 0.99 ? -bot.vx : bot.vx;
    bot.position.x += bot.vx;
    if (bot.position.x > 350 || bot.position.x < -350) bot.vx *= -1;
    botMesh.position.copy(bot.position);

    // Tripod movement
    if (tripod.jam > 0) {
      tripod.jam--;
      tripodGroup.material = new THREE.MeshStandardMaterial({ color: 0x00ffff });
    } else {
      tripod.x += tripod.speed * tripod.direction;
      if (tripod.x > 300 || tripod.x < -300) tripod.direction *= -1;
    }
    tripodGroup.position.x = tripod.x;

    // Target
    let target = frame % 300 < 150 ? player.position : bot.position;
    let direction = new THREE.Vector3().subVectors(target, tripodGroup.position).normalize();

    createLaser(tripodGroup.position.clone(), direction);

    // Damage
    if (tripod.jam <= 0) {
      [player, bot].forEach((p, idx) => {
        let toTarget = new THREE.Vector3().subVectors(p.position, tripodGroup.position);
        let dist = toTarget.length();
        toTarget.normalize();
        
        let angle = Math.acos(toTarget.dot(direction));
        if (angle < 0.15 && dist < 1500) {
          p.hp -= 0.5;
          if (p.hp <= 0) {
            createParticles(p.position);
            running = false;
            setTimeout(() => {
              document.getElementById('menu').style.display = 'flex';
              document.getElementById('menu').innerHTML = '<div>GAME OVER</div><button onclick="location.reload()">RESTART</button>';
            }, 1500);
          }
        }
      });
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.position.add(p.velocity);
      p.velocity.multiplyScalar(0.95);
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
