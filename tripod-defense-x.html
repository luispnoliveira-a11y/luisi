<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tripod Defense X</title>
<style>
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:monospace;
  overflow:hidden;
}

/* Fake Computer Frame */
#computer{
  width:900px;
  background:#111;
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 80px #0ff4;
  position:relative;
}

#screenWrapper{
  position:relative;
}

canvas{
  background:#050505;
  border-radius:10px;
  display:block;
}

#hud{
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  color:#0f0;
  font-size:14px;
  pointer-events:none;
}

.bar{
  width:200px;
  height:10px;
  background:#222;
  margin:5px auto;
  border:1px solid #555;
}
.fill{height:100%; background:#0af;}

#menu{
  position:absolute;
  inset:0;
  background:#000d;
  color:#0f0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:20px;
}

button{
  padding:10px 20px;
  margin-top:20px;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  cursor:pointer;
}
button:hover{background:#0f0;color:#000;}
</style>
</head>
<body>

<div id="computer">
  <div id="screenWrapper">
    <canvas id="game" width="800" height="500"></canvas>

    <div id="hud">
      YOU<div class="bar"><div id="pHp" class="fill"></div></div>
      BOT<div class="bar"><div id="bHp" class="fill" style="background:#0f0"></div></div>
      <div id="jamText">JAM READY</div>
    </div>

    <div id="menu">
      <div>TRIPOD DEFENSE X</div>
      <button onclick="startGame()">START</button>
      <div style="font-size:12px;margin-top:10px;">
        Move mouse / touch to move<br>
        SPACE = JAM
      </div>
    </div>
  </div>
</div>

<script>
const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d");

let player, bot, tripod, particles, jamCD, running=false;
let frame=0;

function reset(){
  player={x:400,y:250,hp:100};
  bot={x:200,y:400,vx:2,hp:100};
  tripod={x:100,dir:1,speed:2.5,jam:0};
  particles=[];
  jamCD=0;
}

function startGame(){
  document.getElementById("menu").style.display="none";
  reset();
  running=true;
  loop();
}

/* SOUND */
function beep(freq,dur){
  const a=new AudioContext();
  const o=a.createOscillator();
  const g=a.createGain();
  o.connect(g); g.connect(a.destination);
  o.frequency.value=freq;
  o.start();
  g.gain.setValueAtTime(0.1,a.currentTime);
  o.stop(a.currentTime+dur);
}

/* CONTROLS */
cvs.onmousemove=e=>{
  const r=cvs.getBoundingClientRect();
  player.x=e.clientX-r.left;
  player.y=e.clientY-r.top;
};
cvs.ontouchmove=e=>{
  const r=cvs.getBoundingClientRect();
  player.x=e.touches[0].clientX-r.left;
  player.y=e.touches[0].clientY-r.top;
};

window.onkeydown=e=>{
  if(e.code==="Space" && jamCD<=0){
    tripod.jam=120;
    jamCD=600;
    beep(200,0.2);
  }
};

function explode(x,y){
  for(let i=0;i<40;i++){  
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*6,
      vy:(Math.random()-0.5)*6,
      life:60
    });
  }
  beep(80,0.4);
}

function loop(){
  if(!running) return;
  frame++;
  ctx.fillStyle="#050505";
  ctx.fillRect(0,0,800,500);

  if(jamCD>0) jamCD--;
  document.getElementById("jamText").innerText=
    jamCD>0?"RECHARGE "+Math.ceil(jamCD/60)+"s":"JAM READY";

  if(tripod.jam>0) tripod.jam--;
  else{
    tripod.x+=tripod.speed*tripod.dir;
    if(tripod.x>750||tripod.x<50) tripod.dir*=-1;
  }

  bot.x+=bot.vx;
  if(bot.x>780||bot.x<20) bot.vx*=-1;

  let target=(frame%300<150)?player:bot;
  let angle=Math.atan2(target.y-50,target.x-tripod.x);

  ctx.save();
  ctx.translate(tripod.x,50);
  ctx.rotate(angle);
  ctx.fillStyle=tripod.jam>0?"rgba(0,255,255,0.2)":"rgba(255,255,0,0.4)";
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(800,-40);
  ctx.lineTo(800,40);
  ctx.fill();
  ctx.restore();

  if(tripod.jam<=0){
    [player,bot].forEach(p=>{
      let dx=p.x-tripod.x;
      let dy=p.y-50;
      let dist=Math.hypot(dx,dy);
      let a=Math.atan2(dy,dx);
      if(Math.abs(a-angle)<0.1 && dist<700){
        p.hp-=1;
        if(p.hp<=0){explode(p.x,p.y);running=false;
          setTimeout(()=>document.getElementById("menu").style.display="flex",1500);
        }
      }
    });
  }

  particles.forEach(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
    ctx.fillStyle="orange";
    ctx.fillRect(p.x,p.y,3,3);
  });
  particles=particles.filter(p=>p.life>0);

  ctx.fillStyle="#0f0";
  ctx.beginPath(); ctx.arc(bot.x,bot.y,6,0,7); ctx.fill();
  ctx.fillStyle="#0af";
  ctx.beginPath(); ctx.arc(player.x,player.y,4,0,7); ctx.fill();

  document.getElementById("pHp").style.width=player.hp+"%";
  document.getElementById("bHp").style.width=bot.hp+"%";

  requestAnimationFrame(loop);
}
</script>
</body>
</html>
